x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@airflow-db:5432/${POSTGRES_DB}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW_CONN_S3_CONN: ${AIRFLOW_CONN_S3_CONN}
    AIRFLOW_CONN_SOURCE_HTTP_CONN: ${AIRFLOW_CONN_SOURCE_HTTP_CONN}
    # Нужны будущим dbt-задачам, запускаемым внутри сети Compose.
    S3_ENDPOINT: seaweedfs:8333
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    PROJECT_ROOT: /opt/airflow/project
    PYTHONPATH: /opt/airflow/project/src
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./config:/opt/airflow/project/config:ro
    - ./dbt:/opt/airflow/project/dbt:ro
    - ./src:/opt/airflow/project/src:ro
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    # Entrypoint готовит права тома и переключается на пользователя seaweed.
    user: "0:0"
    # Малые внутренние тома оставляют место для всех бакетов на локальном диске.
    command:
      - mini
      - -dir=/data
      - -ip=seaweedfs
      - -s3.port=8333
      - -filer.port=8888
      - -master.volumeSizeLimitMB=256
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: raw,staging,mart
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8890:8888"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # S3-запросы проверки доступа и наличия всех трёх бакетов.
      test:
        - CMD-SHELL
        - |
          for bucket in raw staging mart; do
            curl --fail --silent --show-error \
              --aws-sigv4 aws:amz:us-east-1:s3 \
              --user "$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY" \
              "http://127.0.0.1:8333/$$bucket/" >/dev/null || exit 1
          done
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  airflow-db:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-scheduler:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    environment:
      <<: *airflow-environment
      # Только scheduler готовит метабазу и администратора перед своим запуском.
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      _AIRFLOW_WWW_USER_FIRSTNAME: ITAD
      _AIRFLOW_WWW_USER_LASTNAME: Admin
      _AIRFLOW_WWW_USER_EMAIL: admin@example.local
      _AIRFLOW_WWW_USER_ROLE: Admin
    depends_on:
      airflow-db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    command: scheduler
    healthcheck:
      # Heartbeat появляется после завершения миграций и запуска scheduler.
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

volumes:
  airflow-db-data:
  airflow-logs:
  seaweedfs-data:
